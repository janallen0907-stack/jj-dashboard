<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JJ Content Engine</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f17;
    color: white;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    background: #0d1117;
    padding: 20px;
    height: 100vh;
    border-right: 1px solid rgba(255,255,255,0.05);
}

.sidebar h2 {
    font-size: 16px;
    margin-bottom: 20px;
    color: #8b5cf6;
}

.sidebar div {
    margin: 10px 0;
    opacity: 0.7;
    cursor: pointer;
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
}

/* TOP BAR */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
}

/* STATS */
.stats {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.stat {
    flex: 1;
    background: #111827;
    padding: 20px;
    border-radius: 12px;
}

/* CONTENT LIST */
.list {
    margin-top: 30px;
}

.item {
    display: flex;
    gap: 15px;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.item img {
    width: 120px;
    height: 80px;
    object-fit: cover;
    border-radius: 8px;
}

.meta {
    flex: 1;
}

.score {
    font-size: 20px;
    font-weight: bold;
    color: #a78bfa;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>JJ Engine</h2>
    <div>Dashboard</div>
    <div>All Content</div>
    <div>High Score</div>
</div>

<div class="main">

    <div class="topbar">
        <h1>Dashboard</h1>
        <button id="generateBtn">Generate</button>
    </div>

    <div class="stats">
        <div class="stat">
            <div>Total</div>
            <h2 id="total">0</h2>
        </div>

        <div class="stat">
            <div>High Score</div>
            <h2 id="high">0</h2>
        </div>

        <div class="stat">
            <div>Average</div>
            <h2 id="avg">0</h2>
        </div>
    </div>

    <div class="list" id="list"></div>

</div>

<script>
async function loadContent() {
    const res = await fetch('/api/content');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = '';

    let total = data.length;
    let high = 0;
    let sum = 0;

    data.forEach(item => {
        const score = item.metadata?.score || 0;
        sum += score;
        if (score > high) high = score;

        const div = document.createElement('div');
        div.className = 'item';

        div.innerHTML = `
            <img src="https://picsum.photos/200/100?random=${Math.random()}">
            <div class="meta">
                <b>${item.metadata?.video?.title || 'Untitled'}</b>
                <div>${item.script}</div>
                <small>${item.visuals?.prompt || ''}</small>
            </div>
            <div class="score">${score}</div>
        `;

        list.appendChild(div);
    });

    document.getElementById('total').innerText = total;
    document.getElementById('high').innerText = high;
    document.getElementById('avg').innerText = total ? (sum / total).toFixed(1) : 0;
}

// BUTTON
document.getElementById('generateBtn').addEventListener('click', async () => {
    await fetch('/api/generate');
    loadContent();
});

loadContent();
setInterval(loadContent, 5000);
</script>

</body>
</html>
