<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JJ Dashboard</title>

<style>
    body {
        background: #0d0d0d;
        color: #fff;
        font-family: Arial, sans-serif;
        padding: 40px;
    }

    h1 {
        margin-bottom: 20px;
    }

    .card {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .title {
        font-weight: bold;
        margin-bottom: 10px;
    }

    .script {
        opacity: 0.9;
        margin-bottom: 8px;
    }

    .style {
        opacity: 0.6;
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>JJ Dashboard (Live)</h1>

<div id="content"></div>

<script>
async function loadContent() {
    const res = await fetch('/api/content');
    const data = await res.json();

    const container = document.getElementById('content');
    container.innerHTML = '';

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';

        div.innerHTML = `
            <div class="title">${item.metadata?.video?.title || 'Untitled'}</div>
            <div class="script">${item.script}</div>
            <div class="style">${item.visuals?.prompt || ''}</div>
        `;

        container.appendChild(div);
    });
}

loadContent();
setInterval(loadContent, 5000);
</script>

</body>
</html>
