<!DOCTYPE html>
<html>
<head>
<title>JJ Dashboard</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;}
.card{background:#111;padding:15px;margin-bottom:20px;border-radius:10px;}
</style>
</head>
<body>
<h1>JJ Dashboard (Live)</h1>
<div id="container"></div>
<script>
const container=document.getElementById('container');

async function loadData(){
    const res=await fetch('/api/videos');
    const data=await res.json();
    container.innerHTML='';
    data.reverse().forEach(v=>{
        const div=document.createElement('div');
        div.className='card';
        div.innerHTML=`<h3>${v.metadata.video?.title||''}</h3>
        <pre>${v.script}</pre>
        <p>${v.visuals.prompt||''}</p>`;
        container.appendChild(div);
    });
}

loadData();
setInterval(loadData,3000);
</script>
</body>
</html>
