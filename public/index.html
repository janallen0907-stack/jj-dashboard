<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JJ Dashboard</title>

<style>
body {
    background: #0d0d0d;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 40px;
}

h1 {
    margin-bottom: 30px;
}

button {
    background: #111;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 20px;
}

button:hover {
    background: #222;
}

.card {
    background: linear-gradient(145deg, #1a1a1a, #111);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.title {
    font-weight: bold;
    margin-bottom: 10px;
}

.script {
    opacity: 0.9;
    margin-bottom: 10px;
    line-height: 1.4;
}

.style {
    opacity: 0.6;
    font-size: 14px;
}
</style>
</head>

<body>

<h1>JJ Dashboard (Live)</h1>

<button id="generateBtn">Generate Now</button>

<div id="content"></div>

<script>
async function loadContent() {
    const res = await fetch('/api/content');
    const data = await res.json();

    const container = document.getElementById('content');
    container.innerHTML = '';

    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';

        div.innerHTML = `
            <div class="title">${item.metadata?.video?.title || 'Untitled'}</div>
            <div class="script">${item.script}</div>
            <div class="style">${item.visuals?.prompt || ''}</div>
        `;

        container.appendChild(div);
    });
}

// 🔥 BUTTON LOGIC
const btn = document.getElementById('generateBtn');

btn.addEventListener('click', async () => {
    btn.innerText = "Generating...";
    btn.disabled = true;

    try {
        await fetch('/api/generate');
        await loadContent();
    } catch (err) {
        console.error(err);
        alert("Failed to generate");
    }

    btn.innerText = "Generate Now";
    btn.disabled = false;
});

// 🔄 AUTO REFRESH
loadContent();
setInterval(loadContent, 5000);
</script>

</body>
</html>
